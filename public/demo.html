<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo · ingesproken feedback</title>
<style>
  @font-face { font-family: Montserrat; src: url(/fonts/montserrat-latin-wght-normal.woff2) format("woff2"); font-weight: 100 900; font-display: swap; }
  body { font: 16px/1.6 Montserrat, system-ui, sans-serif; margin: 0; color: #3c3c3c; background: #f6f8fa; }
  header { background: #242f36; color: #fff; padding: 16px 24px; display: flex; gap: 24px; align-items: center; }
  header strong { border-left: 5px solid #f8e800; padding-left: 10px; }
  nav a { color: #fff; margin-right: 16px; text-decoration: none; font-weight: 500; }
  nav a:hover { color: #f8e800; }
  main { max-width: 720px; padding: 24px; }
  code { background: #eaedf0; padding: 1px 4px; border-radius: 4px; }
  pre { background: #fff; box-shadow: 1px 10px 40px #0000001f; padding: 12px; border-radius: 8px; overflow: auto; }
</style>
</head>
<body>
<header>
  <strong>Demo-app</strong>
  <nav>
    <a href="/demo/overzicht" data-spa>Overzicht</a>
    <a href="/demo/instellingen?tab=profiel" data-spa>Instellingen</a>
    <a href="#/details/42">Details (hash)</a>
  </nav>
</header>
<main>
  <h1 id="page-title">Start</h1>
  <p>Dit is een nep-SPA: de links hierboven veranderen de URL zonder te herladen.
    Neem rechtsonder iets op, klik ondertussen rond, en kijk daarna in <a href="/admin">/admin</a>
    welke pagina's er bij de opname zijn vastgelegd.</p>
  <p>In je eigen app is dit alles wat nodig is:</p>
  <pre id="snippet"></pre>
</main>
<script>
  document.addEventListener('click', (e) => {
    const a = e.target.closest('a[data-spa]');
    if (!a) return;
    e.preventDefault();
    history.pushState({}, '', a.href);
    document.getElementById('page-title').textContent = a.textContent;
    document.title = a.textContent + ' · demo';
  });
  // De nieuwste vaste release, met de hash erbij: dan voert de browser alleen precies dat bestand uit.
  fetch('/widget-releases.json').then((r) => r.json()).then((releases) => {
    const [version, integrity] = Object.entries(releases).at(-1);
    document.getElementById('snippet').textContent =
      `<script src="${location.origin}/widget-${version}.js"\n  integrity="${integrity}" crossorigin="anonymous"\n  data-project="mijn-app" defer><\/script>`;
  });
</script>
<script src="/widget.js" data-project="demo" data-context='{"omgeving":"demo"}' defer></script>
</body>
</html>
